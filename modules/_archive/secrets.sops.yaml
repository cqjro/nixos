# sops creation rules for secrets/*.yaml (docs/secrets.md, "Bootstrap").
# Only PUBLIC age recipients belong here. The two lines marked TODO are the human's
# to fill in; until they are real, `sops` refuses to encrypt, which is the safe
# failure. Never put an AGE-SECRET-KEY in this repository.
keys:
  # age public key of the admin (`age-keygen -o ~/.config/sops/age/keys.txt` on
  # GOD-KILLER, then `age-keygen -y` prints the public half)
  - &admin TODO-age1-public-key-of-cairo
  # REDRUM host key: `ssh-keyscan -t ed25519 <redrum> | ssh-to-age` (public only)
  - &redrum TODO-age1-public-key-of-redrum-host
creation_rules:
  - path_regex: secrets/REDRUM\.yaml$
    key_groups:
      - age:
          - *admin
          - *redrum
